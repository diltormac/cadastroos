<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel de Ordens de Serviço · Clínica da Roda</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/painel.css" />
  </head>
  <body>
    <div class="page-wrap">
      <div id="headerSlot"></div>

      <main>
        <div id="kpisSlot"></div>

        <section class="filter-bar">
          <input
            id="fBusca"
            type="search"
            placeholder="Buscar por cliente, telefone, placa, documento, serviço ou aparelho…"
          />
          <select id="fStatus">
            <option value="">Status: Todos</option>
            <option value="Pendente">Pendente</option>
            <option value="Finalizado">Finalizado</option>
          </select>
          <select id="fFinal">
            <option value="">Finalização: Todas</option>
            <option value="0">Em aberto</option>
            <option value="1">Finalizadas</option>
          </select>
          <select id="fAparelho">
            <option value="">Todos os aparelhos</option>
          </select>
          <button id="btnLimparFiltros" class="btn" type="button">
            Limpar
          </button>
        </section>

        <div id="boxPrimeiroAcesso" class="empty-box" style="display: none">
          <p>
            Este aparelho ainda não possui dados locais no
            <strong>OsPainelDB</strong>.
          </p>
          <p style="font-size: 12.5px; color: var(--muted); margin-top: 6px">
            Escolha como deseja carregar as Ordens de Serviço neste dispositivo:
          </p>
          <div
            style="
              display: flex;
              gap: 10px;
              justify-content: center;
              flex-wrap: wrap;
              margin-top: 14px;
            "
          >
            <button
              id="btnInicialSupabase"
              class="btn btn-primary"
              type="button"
            >
              ⬇ Baixar do Supabase
            </button>
            <button id="btnInicialRestaurar" class="btn" type="button">
              ⬆ Restaurar arquivo (.json)
            </button>
          </div>
        </div>

        <section class="cards-grid" id="cards"></section>
      </main>
    </div>

    <div
      class="modal-backdrop"
      id="modalOverlay"
      role="dialog"
      aria-modal="true"
    >
      <div class="modal-box" id="modalConteudo"></div>
    </div>

    <div
      class="lightbox-backdrop"
      id="lightboxOverlay"
      role="dialog"
      aria-modal="true"
    >
      <div class="lightbox-box">
        <div class="lightbox-top">
          <span id="lightboxLegenda" class="mono"></span>
          <button
            class="btn-close"
            id="btnLightboxFechar"
            type="button"
            aria-label="Fechar foto"
          >
            ×
          </button>
        </div>
        <div class="lightbox-stage">
          <button
            class="btn lightbox-nav"
            id="btnLightboxPrev"
            type="button"
            aria-label="Foto anterior"
          >
            ‹
          </button>
          <img id="lightboxImg" src="" alt="Visualização ampliada da foto" />
          <button
            class="btn lightbox-nav"
            id="btnLightboxNext"
            type="button"
            aria-label="Próxima foto"
          >
            ›
          </button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="./js/painel.js"></script>
  </body>
</html>
